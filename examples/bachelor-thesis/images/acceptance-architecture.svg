  <g fill="none" stroke="#c65338" stroke-width="6" marker-end="url(#arrow)">
    <path d="M300 350 H340"/>
    <path d="M585 350 H625"/>
    <path d="M870 350 H910"/>
    <path d="M1155 350 H1195"/>
