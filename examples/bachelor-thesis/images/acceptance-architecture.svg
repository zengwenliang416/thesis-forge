  <g font-family="Georgia, serif" font-size="19" fill="#41675e">
    <text x="180" y="520" text-anchor="middle">Read-only source graph</text>
    <text x="465" y="520" text-anchor="middle">No Word implementation details</text>
    <text x="750" y="520" text-anchor="middle">Deterministic semantics</text>
    <text x="1035" y="520" text-anchor="middle">Real editable objects</text>
    <text x="1290" y="520" text-anchor="middle">Office compatible</text>
