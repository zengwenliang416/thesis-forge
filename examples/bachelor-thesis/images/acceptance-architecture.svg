  </text>
  <g filter="url(#shadow)" font-family="Georgia, serif">
    <g transform="translate(70 255)">
      <rect width="220" height="190" rx="24" fill="#fffdf7" stroke="#d8c7a8" stroke-width="3"/>
      <text x="110" y="66" text-anchor="middle" font-size="29" font-weight="700" fill="#17352d">Markdown</text>
      <text x="110" y="108" text-anchor="middle" font-size="18" fill="#55756d">YAML + BibTeX</text>
      <text x="110" y="139" text-anchor="middle" font-size="18" fill="#55756d">Local images</text>
    </g>
    <g transform="translate(355 255)">
      <rect width="220" height="190" rx="24" fill="#fef8ed" stroke="#d8c7a8" stroke-width="3"/>
      <text x="110" y="66" text-anchor="middle" font-size="29" font-weight="700" fill="#17352d">Domain</text>
      <text x="110" y="108" text-anchor="middle" font-size="18" fill="#55756d">ThesisDocument</text>
      <text x="110" y="139" text-anchor="middle" font-size="18" fill="#55756d">Validation</text>
    </g>
    <g transform="translate(640 255)">
      <rect width="220" height="190" rx="24" fill="#edf5ef" stroke="#94b5a8" stroke-width="3"/>
      <text x="110" y="66" text-anchor="middle" font-size="29" font-weight="700" fill="#17352d">Compiler</text>
      <text x="110" y="108" text-anchor="middle" font-size="18" fill="#55756d">Numbering</text>
      <text x="110" y="139" text-anchor="middle" font-size="18" fill="#55756d">RenderPlan</text>
    </g>
    <g transform="translate(925 255)">
      <rect width="220" height="190" rx="24" fill="#fff4ef" stroke="#db9b88" stroke-width="3"/>
      <text x="110" y="66" text-anchor="middle" font-size="29" font-weight="700" fill="#17352d">Renderer</text>
      <text x="110" y="108" text-anchor="middle" font-size="18" fill="#55756d">OOXML fields</text>
      <text x="110" y="139" text-anchor="middle" font-size="18" fill="#55756d">Atomic output</text>
    </g>
    <g transform="translate(1210 255)">
      <rect width="160" height="190" rx="24" fill="#17352d" stroke="#17352d" stroke-width="3"/>
      <text x="80" y="76" text-anchor="middle" font-size="32" font-weight="700" fill="#fffdf7">DOCX</text>
      <text x="80" y="119" text-anchor="middle" font-size="18" fill="#d8e7e1">Editable</text>
      <text x="80" y="149" text-anchor="middle" font-size="18" fill="#d8e7e1">Verified</text>
    </g>
