<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1e3"/>
      <stop offset="1" stop-color="#e5efe9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#17352d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c65338"/>
    </marker>
  </defs>
  <rect width="1440" height="720" rx="36" fill="url(#background)"/>
  <g opacity="0.22" fill="none" stroke="#1d5b4f" stroke-width="2">
    <path d="M80 120 H1360"/>
    <path d="M80 600 H1360"/>
    <circle cx="160" cy="120" r="26"/>
    <circle cx="1280" cy="600" r="26"/>
  </g>
  <text x="720" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#17352d">
    ThesisForge Deterministic Pipeline
  </text>
  <text x="720" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#41675e">
