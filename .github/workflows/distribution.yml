name: Distribution

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/distribution.yml"
      - "frontend/**"
      - "scripts/build_sidecar.py"
      - "scripts/verify_distribution.py"
      - "scripts/verify_desktop_distribution.py"
      - "src/**"
      - "src-tauri/**"
      - "templates/**"
      - "tests/test_desktop_distribution.py"
      - "tests/test_distribution.py"
  push:
    tags:
      - "v*"

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos
            bundles: app
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.5"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Python build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.9" --locked
      - name: Install Tauri WebDriver
        if: runner.os == 'Windows'
        run: cargo install tauri-driver --version "^2.0" --locked
      - name: Build isolated Web distribution
        run: pnpm --dir frontend exec tsc -b && pnpm --dir frontend exec vite build --outDir ../dist/web --emptyOutDir
      - name: Build and verify isolated Python distribution
        run: python -m build --no-isolation --outdir dist/python && python scripts/verify_distribution.py --dist-dir dist/python
      - name: Build target-native frozen sidecar
        run: python scripts/build_sidecar.py --target-triple ${{ matrix.target }}
      - name: Verify frozen sidecar offline
        run: python scripts/verify_desktop_distribution.py --target-triple ${{ matrix.target }} --sidecar-only
      - name: Build native Tauri bundles
        run: cargo tauri build --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -vv
      - name: Build macOS DMG with diagnostics
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg_bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          app_bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos/ThesisForge.app"
          app_backup_dir="${RUNNER_TEMP}/ThesisForge.app"
          if [[ ! -d "$app_bundle_dir" ]]; then
            echo "::error::macOS app bundle is missing before DMG construction"
            exit 1
          fi
          rm -rf "$app_backup_dir"
          ditto "$app_bundle_dir" "$app_backup_dir"
          for attempt in 1 2 3; do
            rm -rf "$dmg_bundle_dir"
            if cargo tauri build \
              --config src-tauri/tauri.release.conf.json \
              --target ${{ matrix.target }} \
              --bundles dmg \
              --ci \
              -vv; then
              rm -rf "$app_bundle_dir"
              ditto "$app_backup_dir" "$app_bundle_dir"
              exit 0
            fi
            echo "::warning::macOS DMG build attempt ${attempt} failed"
            hdiutil info || true
            sleep "$((attempt * 5))"
          done
          exit 1
      - name: Remove macOS metadata sidecars
        if: runner.os == 'macOS'
        run: dot_clean -m src-tauri/target/${{ matrix.target }}/release/bundle
      - name: Verify native desktop distribution
        run: python scripts/verify_desktop_distribution.py --target-triple ${{ matrix.target }} --platform ${{ matrix.platform }} --web-dist dist/web --bundle-root src-tauri/target/${{ matrix.target }}/release/bundle
      - name: Install Windows MSI and prepare native acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundleRoot = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $msi = Get-ChildItem $bundleRoot -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) {
            throw "Windows MSI artifact is missing"
          }
          $installLog = Join-Path $env:RUNNER_TEMP "thesisforge-windows-install.log"
          $arguments = "/i `"$($msi.FullName)`" /qn /norestart /l*v `"$installLog`""
          $installer = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
          if ($installer.ExitCode -notin 0, 3010) {
            throw "MSI installation failed with exit code $($installer.ExitCode)"
          }

          $roots = @(
            (Join-Path $env:LOCALAPPDATA "Programs"),
            $env:ProgramFiles,
            ${env:ProgramFiles(x86)}
          ) | Where-Object { $_ -and (Test-Path $_) }
          $app = Get-ChildItem $roots -Filter *.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @("ThesisForge.exe", "thesisforge-desktop.exe") -and
              $_.FullName -notlike "*\target\*"
            } |
            Select-Object -First 1
          if (-not $app) {
            throw "Installed ThesisForge executable was not found"
          }

          $workspace = Join-Path $env:RUNNER_TEMP "thesisforge-windows-native"
          $evidence = Join-Path $env:RUNNER_TEMP "windows-native-evidence"
          New-Item -ItemType Directory -Force -Path $workspace, $evidence | Out-Null
          Copy-Item "examples/bachelor-thesis/*" $workspace -Recurse -Force
          "THESISFORGE_WINDOWS_APP=$($app.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "THESISFORGE_WINDOWS_SOURCE=$(Join-Path $workspace 'thesis.md')" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "THESISFORGE_WINDOWS_EVIDENCE=$evidence" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Probe installed Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = $env:THESISFORGE_WINDOWS_EVIDENCE
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $probePath = Join-Path $evidence "windows-app-probe.json"
          $env:THESISFORGE_BLOCK_NETWORK = "1"
          $probe = [ordered]@{
            app = $env:THESISFORGE_WINDOWS_APP
            startedAt = (Get-Date).ToUniversalTime().ToString("o")
            pid = $null
            aliveAfterSeconds = $false
            exitCode = $null
            launchError = $null
            processes = @()
          }
          $process = $null
          try {
            $process = Start-Process `
              -FilePath $env:THESISFORGE_WINDOWS_APP `
              -PassThru
            $probe.pid = $process.Id
            Start-Sleep -Seconds 10
            $process.Refresh()
            $probe.aliveAfterSeconds = -not $process.HasExited
            if ($process.HasExited) {
              $probe.exitCode = $process.ExitCode
            }
            $probe.processes = @(
              Get-CimInstance Win32_Process |
                Where-Object {
                  $_.ProcessId -eq $process.Id -or
                  $_.ParentProcessId -eq $process.Id -or
                  $_.Name -match "thesisforge|msedgewebview2"
                } |
                Select-Object Name, ProcessId, ParentProcessId, ExecutablePath,
                  CommandLine, CreationDate
            )
          } catch {
            $probe.launchError = $_.Exception.ToString()
          } finally {
            $probe.completedAt = (Get-Date).ToUniversalTime().ToString("o")
            $probe |
              ConvertTo-Json -Depth 6 |
              Set-Content -Path $probePath -Encoding utf8
            if ($process -and -not $process.HasExited) {
              taskkill.exe /PID $process.Id /T /F | Out-Null
            }
          }
      - name: Run installed Windows native acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem Env: |
            Where-Object {
              $_.Name -match "(_API_KEY|_TOKEN)$" -or
              $_.Name -in @("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "NO_PROXY")
            } |
            Remove-Item
          $env:THESISFORGE_BLOCK_NETWORK = "1"
          $wdioLog = Join-Path `
            $env:THESISFORGE_WINDOWS_EVIDENCE `
            "wdio-console.log"
          pnpm --dir frontend e2e:tauri:windows 2>&1 |
            Tee-Object -FilePath $wdioLog
          $wdioExitCode = $LASTEXITCODE
          if ($wdioExitCode -ne 0) {
            exit $wdioExitCode
          }
      - name: Collect Windows native acceptance diagnostics
        if: runner.os == 'Windows' && always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $evidence = if ($env:THESISFORGE_WINDOWS_EVIDENCE) {
            $env:THESISFORGE_WINDOWS_EVIDENCE
          } else {
            Join-Path $env:RUNNER_TEMP "windows-native-evidence"
          }
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          if (Test-Path "frontend/logs") {
            Copy-Item "frontend/logs" (Join-Path $evidence "wdio-logs") `
              -Recurse -Force
          }

          $processes = @(
            Get-CimInstance Win32_Process |
              Where-Object {
                $_.Name -match (
                  "thesisforge|tauri-driver|msedgedriver|msedgewebview2"
                )
              } |
              Select-Object Name, ProcessId, ParentProcessId, ExecutablePath,
                CommandLine, CreationDate
          )
          ConvertTo-Json -InputObject $processes -Depth 4 |
            Set-Content `
              -Path (Join-Path $evidence "windows-processes.json") `
              -Encoding utf8

          $events = @(
            Get-WinEvent -FilterHashtable @{
              LogName = "Application"
              StartTime = (Get-Date).AddMinutes(-30)
            } -ErrorAction SilentlyContinue |
              Where-Object {
                $_.ProviderName -match (
                  "Application Error|Windows Error Reporting|WebView2|Edge"
                ) -or
                $_.Message -match "thesisforge|msedgewebview2|WebView2"
              } |
              Select-Object TimeCreated, Id, LevelDisplayName, ProviderName,
                Message
          )
          ConvertTo-Json -InputObject $events -Depth 4 |
            Set-Content `
              -Path (Join-Path $evidence "windows-application-events.json") `
              -Encoding utf8

          $webViewRoots = @(
            $env:TEMP,
            (Join-Path $env:LOCALAPPDATA "com.thesisforge.workbench")
          ) | Where-Object { $_ -and (Test-Path $_) }
          $devToolsPorts = @(
            Get-ChildItem -LiteralPath $webViewRoots -Filter DevToolsActivePort `
              -File -Recurse -Force -ErrorAction SilentlyContinue |
              Select-Object FullName, Length, CreationTimeUtc, LastWriteTimeUtc
          )
          ConvertTo-Json -InputObject $devToolsPorts -Depth 3 |
            Set-Content `
              -Path (Join-Path $evidence "windows-devtools-active-port.json") `
              -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: windows-native-evidence
          path: |
            ${{ runner.temp }}/windows-native-evidence
            ${{ runner.temp }}/thesisforge-windows-install.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: thesisforge-web-${{ matrix.target }}
          path: dist/web
      - uses: actions/upload-artifact@v4
        with:
          name: thesisforge-python-${{ matrix.target }}
          path: dist/python
      - uses: actions/upload-artifact@v4
        with:
          name: thesisforge-sidecar-${{ matrix.target }}
          path: src-tauri/binaries
      - uses: actions/upload-artifact@v4
        with:
          name: thesisforge-desktop-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle
