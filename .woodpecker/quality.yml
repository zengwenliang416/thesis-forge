clone:
  git:
    image: woodpeckerci/plugin-git:2.9.2@sha256:a36586dfe77e9c5d9b5bff3ad37f18158eb12036aa9e9908e2e813ee6029573e
    settings:
      partial: false
      depth: 0

labels:
  location: production-80
  platform: linux/amd64
  backend: docker

when:
  - event: pull_request
  - event: push
    branch: main
  - event: tag
    ref: refs/tags/v*
  - event: manual

concurrency:
  limit: 1
  group: thesis-forge-quality

steps:
  - name: python-quality
    image: python:3.12-bookworm@sha256:9bbdaa0482ba166a4aa36b03162892a871c269311817cf7132db0922d6c7e91d
    environment:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    commands:
      - python -m venv --clear .venv
      - .venv/bin/python -m pip install -e ".[dev]"
      - .venv/bin/python -m ruff check src tests qa spikes scripts
      - .venv/bin/python -m pytest tests/ -q
      - .venv/bin/python qa/tools/parser_diff.py examples/v2-format-corpus/thesis.md
      - .venv/bin/python qa/tools/build_catalog.py
      - .venv/bin/python -m build --no-isolation --outdir dist/python
      - .venv/bin/python scripts/verify_distribution.py --dist-dir dist/python

  - name: frontend-quality
    image: node:24-bookworm@sha256:107ceb6ad85808049dccef12414bf17b08eceb299eaf755c0339dc5fc8958d6b
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    commands:
      - corepack enable
      - corepack prepare pnpm@10.34.5 --activate
      - pnpm --dir frontend install --frozen-lockfile
      - pnpm --dir frontend lint
      - pnpm --dir frontend typecheck
      - pnpm --dir frontend test
      - pnpm --dir frontend build

  - name: rust-quality
    image: rust:1.90-bookworm@sha256:3f6e6f8d8725a65a2db964bb828850f888d430c68784d661f753144e5d787207
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - rustup component add rustfmt
      - cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - cargo test --locked --manifest-path src-tauri/Cargo.toml
      - cargo check --locked --manifest-path src-tauri/Cargo.toml
