id: docforge-standard
name: DocForge 通用文档标准模板
year: 2026

page:
  size: A4
  orientation: portrait
  margin:
    top: 25mm
    bottom: 25mm
    left: 28mm
    right: 28mm

cover:
  items:
    - field: metadata.title.zh
      required: true
      required_group: metadata.title
      style:
        font:
          east_asia: 黑体
          latin: Times New Roman
        size: 24pt
        bold: true
        alignment: center
        space_before: 36pt
        space_after: 18pt
        line_spacing:
          type: fixed
          value: 32pt
    - field: metadata.title.en
      required: true
      required_group: metadata.title
      style:
        font:
          east_asia: 宋体
          latin: Times New Roman
        size: 14pt
        alignment: center
        space_after: 18pt
        line_spacing:
          type: fixed
          value: 20pt
    - field: metadata.subtitle.zh
      style:
        font:
          east_asia: 宋体
          latin: Times New Roman
        size: 16pt
        alignment: center
        space_after: 30pt
        line_spacing:
          type: fixed
          value: 24pt
    - field: metadata.organization
      prefix: "组织："
      style:
        size: 12pt
        alignment: center
        space_after: 8pt
    - field: metadata.authors
      prefix: "作者："
      style:
        size: 12pt
        alignment: center
        space_after: 8pt
    - field: metadata.version
      prefix: "版本："
      style:
        size: 12pt
        alignment: center
        space_after: 8pt
    - field: metadata.date
      prefix: "日期："
      style:
        size: 12pt
        alignment: center
        space_after: 8pt
    - field: metadata.keywords
      prefix: "关键词："
      style:
        size: 11pt
        alignment: center

body:
  font:
    east_asia: 宋体
    latin: Times New Roman
  size: 12pt
  alignment: justify
  first_line_indent: 2em
  line_spacing:
    type: fixed
    value: 20pt

heading:
  level1:
    font:
      east_asia: 黑体
      latin: Times New Roman
    size: 16pt
    bold: true
    alignment: center
    page_break_before: true
  level2:
    font:
      east_asia: 黑体
      latin: Times New Roman
    size: 14pt
    bold: true
  level3:
    font:
      east_asia: 黑体
      latin: Times New Roman
    size: 12pt
    bold: true

figure:
  numbering: chapter
  caption:
    position: bottom
    prefix: 图

table:
  style: three_line
  three_line:
    top_width: 1.5pt
    header_width: 0.75pt
    bottom_width: 1.5pt
  numbering: chapter
  caption:
    position: top
    prefix: 表

equation:
  numbering: chapter

citation:
  style: GB-T-7714-2025

sections:
  cover:
    start: new_page
    page_number:
      format: none
  main:
    start: new_page
    footer:
      enabled: true
    page_number:
      format: decimal
      restart: 1
