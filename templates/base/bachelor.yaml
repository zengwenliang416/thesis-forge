id: bachelor-base
name: 本科毕业论文基础模板
year: base

page:
  size: A4
  orientation: portrait
  margin:
    top: 25mm
    bottom: 25mm
    left: 30mm
    right: 25mm

body:
  font:
    east_asia: 宋体
    latin: Times New Roman
  size: 12pt
  alignment: justify
  first_line_indent: 2em
  line_spacing:
    type: fixed
    value: 20pt

heading:
  level1:
    size: 16pt
    bold: true
    alignment: center
  level2:
    size: 14pt
    bold: true
  level3:
    size: 12pt
    bold: true

figure:
  numbering: chapter
  caption:
    position: bottom
    prefix: 图

table:
  style: three_line
  numbering: chapter
  caption:
    position: top
    prefix: 表

equation:
  numbering: chapter

citation:
  style: GB-T-7714-2025
