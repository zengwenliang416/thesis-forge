[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "thesis-forge"
version = "0.1.0"
description = "Offline-first, template-driven academic thesis compiler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "python-docx>=1.1,<2",
  "lxml>=5.2,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
bibliography = ["citeproc-py>=0.8,<1"]
ui = ["PySide6>=6.7,<7"]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.25,<2",
  "packaging>=24,<27",
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
]

[project.scripts]
thesisforge = "thesis_forge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/thesis_forge"]
exclude = ["**/._*"]

[tool.hatch.build.targets.wheel.force-include]
"templates/base/bachelor.yaml" = "thesis_forge/template_data/base/bachelor.yaml"
"templates/schools/example-university/2026.yaml" = "thesis_forge/template_data/schools/example-university/2026.yaml"

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/Makefile",
  "/README.md",
  "/docs",
  "/examples",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/templates",
  "/tests",
]
exclude = ["**/._*", "**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/._*"]

[tool.ruff.lint]
ignore = ["EXE002"]
