[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docforge"
version = "0.1.0"
description = "Offline-first, template-driven Markdown document compiler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "python-docx>=1.1,<2",
  "lxml>=5.2,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  # ADR-0001：markdown-it 解析后端（版本区间锁定 spike 实证过的行为）
  "markdown-it-py>=4.2,<5",
  "mdit-py-plugins>=0.6.1,<0.7",
]

[project.optional-dependencies]
bibliography = ["citeproc-py>=0.8,<1"]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.25,<2",
  "packaging>=24,<27",
  "pyinstaller>=6.14,<7",
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
]

[project.scripts]
docforge = "docforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/docforge"]
exclude = ["**/._*"]

[tool.hatch.build.targets.wheel.force-include]
"templates/base/bachelor.yaml" = "docforge/template_data/base/bachelor.yaml"
"templates/base/docforge-standard.yaml" = "docforge/template_data/base/docforge-standard.yaml"
"templates/schools/example-university/2026.yaml" = "docforge/template_data/schools/example-university/2026.yaml"
"templates/schools/project-proposal/2026.yaml" = "docforge/template_data/schools/project-proposal/2026.yaml"
"templates/schools/hunan-university-of-technology/master-2026.yaml" = "docforge/template_data/schools/hunan-university-of-technology/master-2026.yaml"

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/Makefile",
  "/README.md",
  "/docs",
  "/examples",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/templates",
  "/tests",
]
exclude = ["**/._*", "**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: 需要本机外部工具或较长运行时间的用例（如真 pandoc 渲染）",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/._*", "tmp"]

[tool.ruff.lint]
ignore = ["EXE002"]
