[package]
name = "thesisforge-desktop"
version = "0.1.0"
description = "ThesisForge Tauri 2 desktop shell"
edition = "2024"

[lib]
name = "thesisforge_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
rfd = "0.15.4"

[dev-dependencies]
tempfile = "3.25"
